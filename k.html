<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="NONONICK — a personal operating system for digital products, websites and interactive tools.">
<title>NONONICK — Home Screen OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   1. TOKENS
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}

:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  --font-fa:"Vazirmatn",-apple-system,"Segoe UI",Tahoma,system-ui,sans-serif;

  --bg:#000000;
  --bg-soft:#07080d;
  --text:#f2f5fb;
  --muted:#8d95ab;
  --faint:#5b6479;

  --surface:rgba(255,255,255,.055);
  --surface-2:rgba(255,255,255,.09);
  --surface-3:rgba(255,255,255,.14);
  --border:rgba(255,255,255,.10);
  --border-2:rgba(255,255,255,.20);

  --blue:#3b7dff;
  --cyan:#2ad4ee;
  --violet:#9b6bff;

  --shadow-lg:0 24px 70px rgba(0,0,0,.55);
  --shadow-sm:0 8px 24px rgba(0,0,0,.35);

  --r-lg:26px;
  --r-md:20px;
  --r-sm:14px;

  --pad-x:18px;
  --content-max:880px;
}

[data-theme="light"]{
  --bg:#e9edf5;
  --bg-soft:#f4f6fb;
  --text:#0a1020;
  --muted:#5a6478;
  --faint:#8b93a7;

  --surface:rgba(255,255,255,.68);
  --surface-2:rgba(255,255,255,.82);
  --surface-3:rgba(255,255,255,.95);
  --border:rgba(10,20,45,.10);
  --border-2:rgba(10,20,45,.18);

  --shadow-lg:0 24px 60px rgba(24,38,72,.18);
  --shadow-sm:0 8px 22px rgba(24,38,72,.12);
}

/* ============================================================
   2. BASE
   ============================================================ */
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow:hidden;
  overscroll-behavior:none;
}
html[dir="rtl"] body{font-family:var(--font-fa)}

button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}

:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:2px;
  border-radius:10px;
}
::selection{background:rgba(59,125,255,.4)}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* Ambient background */
.os-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 78% at 10% -12%, rgba(59,125,255,.24), transparent 58%),
    radial-gradient(96% 68% at 94% 4%, rgba(155,107,255,.20), transparent 58%),
    radial-gradient(92% 66% at 48% 118%, rgba(42,212,238,.16), transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
}
[data-theme="light"] .os-bg{
  background:
    radial-gradient(120% 78% at 8% -12%, rgba(59,125,255,.22), transparent 58%),
    radial-gradient(96% 68% at 96% 0%, rgba(155,107,255,.18), transparent 58%),
    radial-gradient(92% 66% at 50% 120%, rgba(42,212,238,.18), transparent 60%),
    linear-gradient(180deg, #eef2f9 0%, #dde4f0 100%);
}

/* ============================================================
   3. SHELL
   ============================================================ */
.os{
  position:relative;z-index:1;
  height:100vh;
  height:100dvh;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
}

/* ---------- Status bar ---------- */
.statusbar{
  position:relative;z-index:40;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 9px) var(--pad-x) 7px;
  font-size:12px;
  letter-spacing:.01em;
}
.sb-left{display:flex;align-items:baseline;gap:7px;min-width:0}
.sb-time{font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.sb-date{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-right{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.sb-sim{
  display:flex;align-items:center;gap:4px;
  padding:2.5px 7px;
  border-radius:999px;
  border:1px dashed var(--border-2);
  background:rgba(255,255,255,.04);
  font-size:9.5px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
}
.sb-sim b{font-weight:700;color:var(--text);font-size:9.5px}
.sb-batt{
  width:24px;height:12px;border-radius:3.5px;
  border:1px solid var(--border-2);
  position:relative;display:inline-block;
}
.sb-batt::before{
  content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;
  width:62%;border-radius:2px;background:currentColor;opacity:.75;
}
.sb-batt::after{
  content:"";position:absolute;right:-3.5px;top:3.5px;
  width:2px;height:5px;border-radius:0 2px 2px 0;background:var(--border-2);
}

/* ---------- Dynamic Island ---------- */
.island-wrap{display:flex;justify-content:center}
.island{
  display:flex;align-items:center;gap:7px;
  height:31px;padding:0 12px;
  border-radius:999px;
  background:#000;
  border:1px solid rgba(255,255,255,.14);
  color:#fff;
  font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:0 6px 20px rgba(0,0,0,.5);
  transition:transform .3s cubic-bezier(.2,.9,.25,1), box-shadow .3s;
}
[data-theme="light"] .island{background:#0a1020;color:#fff}
.island:hover{transform:scale(1.035)}
.island-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 10px var(--cyan);
  animation:pulse 2.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.82)}}

.island-panel{
  position:absolute;z-index:45;
  top:calc(env(safe-area-inset-top,0px) + 46px);
  left:var(--pad-x);right:var(--pad-x);
  max-width:var(--content-max);
  margin-inline:auto;
  padding:14px;
  border-radius:var(--r-md);
  background:var(--surface-2);
  border:1px solid var(--border-2);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  box-shadow:var(--shadow-lg);
  display:grid;gap:10px;
  animation:panelIn .26s cubic-bezier(.2,.9,.25,1);
}
@keyframes panelIn{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}
.island-panel[hidden]{display:none}
.island-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Stage / pages ---------- */
.stage{position:relative;min-height:0;overflow:hidden}
.pages{
  height:100%;
  display:flex;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  direction:ltr;
  scroll-behavior:smooth;
}
.pages::-webkit-scrollbar{display:none}
.page{
  flex:0 0 100%;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-align:start;
  overscroll-behavior:contain;
  padding:6px var(--pad-x) 74px;
  -webkit-overflow-scrolling:touch;
}
.page-inner{max-width:var(--content-max);margin-inline:auto}

/* generic screen */
.screen{
  height:100%;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:6px var(--pad-x) 34px;
}
.screen-inner{max-width:var(--content-max);margin-inline:auto}

/* page dots */
.dots{
  position:absolute;left:0;right:0;bottom:10px;
  display:flex;justify-content:center;gap:7px;z-index:20;
  pointer-events:none;
  direction:ltr;
}
.dot{
  pointer-events:auto;
  width:7px;height:7px;border-radius:50%;
  background:var(--border-2);
  border:0;padding:0;
  transition:background .25s, transform .25s;
}
.dot[aria-current="true"]{background:var(--text);transform:scale(1.18)}

/* page arrows (desktop only) */
.page-arrows{display:none}
@media (hover:hover) and (min-width:768px){
  .page-arrows{display:block}
  .parrow{
    position:absolute;top:50%;transform:translateY(-50%);z-index:25;
    width:36px;height:36px;border-radius:50%;
    display:grid;place-items:center;
    background:var(--surface-2);border:1px solid var(--border);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    color:var(--text);opacity:.5;
    transition:opacity .2s, background .2s;
  }
  .parrow:hover{opacity:1;background:var(--surface-3)}
  .parrow[disabled]{opacity:.15;pointer-events:none}
  .parrow.prev{left:8px}
  .parrow.next{right:8px}
}

/* ============================================================
   4. GRID / WIDGETS
   ============================================================ */
.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px 10px;
  align-items:start;
}
@media (min-width:620px){
  .grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:20px 14px}
}
@media (min-width:900px){
  .grid{grid-template-columns:repeat(8,minmax(0,1fr));gap:22px 16px}
}

.w-full{grid-column:1/-1}
.w-half{grid-column:span 2}
@media (min-width:620px){.w-half{grid-column:span 3}}
@media (min-width:900px){.w-half{grid-column:span 4}}

.card{
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:16px;
  backdrop-filter:blur(22px) saturate(170%);
  -webkit-backdrop-filter:blur(22px) saturate(170%);
  box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.06);
  overflow:hidden;
}
[data-theme="light"] .card{box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.8)}

.card-eyebrow{
  font-size:9.5px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);
  margin:0 0 9px;
  display:flex;align-items:center;gap:6px;
}
.card-title{font-size:16px;font-weight:650;margin:0 0 6px;letter-spacing:-.01em}
.card-text{margin:0;color:var(--muted);font-size:13px;line-height:1.62}
.card-text + .card-text{margin-top:7px}

/* ---------- Hero ---------- */
.hero{
  padding:20px;
  background:
    radial-gradient(120% 130% at 88% -20%, rgba(155,107,255,.20), transparent 60%),
    radial-gradient(100% 120% at 6% 110%, rgba(42,212,238,.14), transparent 60%),
    var(--surface);
  display:flex;gap:16px;align-items:center;
  flex-wrap:wrap;
}
.hero-main{flex:1 1 220px;min-width:0}
.wordmark{
  font-size:clamp(26px,7.5vw,40px);
  font-weight:800;
  letter-spacing:-.035em;
  line-height:1;
  margin:0 0 4px;
  background:linear-gradient(100deg,#fff 8%, var(--cyan) 42%, var(--blue) 62%, var(--violet) 96%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
[data-theme="light"] .wordmark{
  background:linear-gradient(100deg,#0a1020 8%, #1d6bff 46%, #6d3cff 96%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero-role{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin:0 0 11px;font-weight:600;
}
.hero-greet{font-size:13px;color:var(--cyan);margin:0 0 3px;font-weight:600}
.hero-copy{font-size:13.5px;color:var(--muted);line-height:1.62;margin:0 0 15px;max-width:44ch}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}

/* orb */
.orb-wrap{
  position:relative;width:96px;height:96px;flex:0 0 auto;
  margin-inline:auto;
  display:grid;place-items:center;
}
.orb-glow{
  position:absolute;inset:-16px;border-radius:50%;
  background:conic-gradient(from 0deg, transparent, rgba(42,212,238,.42), transparent 58%);
  filter:blur(12px);
  animation:orbSpin 11s linear infinite;
}
.orb{
  position:relative;width:82px;height:82px;border-radius:50%;
  background:radial-gradient(circle at 33% 27%, #d8e8ff 0%, #5b95ff 30%, #7a45ff 62%, #140829 100%);
  box-shadow:
    0 0 42px rgba(91,149,255,.42),
    inset -9px -13px 30px rgba(0,0,0,.62),
    inset 7px 9px 20px rgba(255,255,255,.30);
  animation:orbFloat 7.5s ease-in-out infinite;
}
.orb::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 68% 78%, rgba(42,212,238,.34), transparent 52%);
  mix-blend-mode:screen;
}
@keyframes orbSpin{to{transform:rotate(360deg)}}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:40px;padding:9px 15px;
  border-radius:999px;
  border:1px solid var(--border-2);
  background:var(--surface-2);
  color:var(--text);
  font-size:13px;font-weight:600;
  text-decoration:none;
  transition:transform .18s cubic-bezier(.2,.9,.25,1), background .2s, border-color .2s, opacity .2s;
  white-space:nowrap;
}
.btn:hover{background:var(--surface-3);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn-primary{
  background:linear-gradient(135deg, var(--blue), var(--violet));
  border-color:transparent;color:#fff;
  box-shadow:0 8px 24px rgba(59,125,255,.36);
}
.btn-primary:hover{background:linear-gradient(135deg,#4d8bff,#a678ff)}
.btn-ghost{background:transparent}
.btn-sm{min-height:32px;padding:6px 12px;font-size:12px}
.btn[aria-disabled="true"],.btn:disabled{opacity:.42;pointer-events:none}
.btn-icon{width:38px;height:38px;min-height:38px;padding:0;border-radius:50%}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  min-height:32px;padding:6px 13px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--muted);
  font-size:12px;font-weight:600;
  transition:background .2s,color .2s,border-color .2s;
}
.chip:hover{background:var(--surface-2);color:var(--text)}
.chip[aria-pressed="true"]{
  background:var(--surface-3);
  border-color:var(--border-2);
  color:var(--text);
}

/* ---------- App icons ---------- */
.app-slot{position:relative;display:flex;flex-direction:column;align-items:center}
.app{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  width:100%;padding:0;
  color:inherit;text-align:center;
  border-radius:18px;
}
.app-icon{
  position:relative;
  width:min(100%,68px);aspect-ratio:1;
  border-radius:19px;
  display:grid;place-items:center;
  color:#fff;
  background:linear-gradient(155deg,var(--a1),var(--a2));
  box-shadow:
    0 9px 22px rgba(0,0,0,.42),
    inset 0 1px 0 rgba(255,255,255,.38),
    inset 0 -14px 26px rgba(0,0,0,.26);
  transition:transform .28s cubic-bezier(.2,.9,.25,1), box-shadow .28s;
}
.app-icon::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 46%);
  pointer-events:none;
}
.app:hover .app-icon{transform:translateY(-3px) scale(1.045);box-shadow:0 14px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -14px 26px rgba(0,0,0,.26)}
.app:active .app-icon{transform:scale(.94)}
.app-label{
  font-size:11.5px;font-weight:550;line-height:1.28;
  max-width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
  word-break:break-word;
}
.app-status{
  display:inline-flex;align-items:center;gap:4px;
  font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:2px 7px;border-radius:999px;
  border:1px solid var(--border);
  color:var(--muted);
}
.app-status .dotmark{width:5px;height:5px;border-radius:50%;background:currentColor}
.st-live{color:#37e0a0;border-color:rgba(55,224,160,.35)}
.st-development{color:#ffc861;border-color:rgba(255,200,97,.35)}
.st-experimental{color:var(--violet);border-color:rgba(155,107,255,.4)}
.st-unset{color:var(--faint);border-style:dashed}

/* edit mode */
.edit-controls{
  position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  display:flex;gap:4px;z-index:5;
}
.edit-controls button{
  width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--surface-3);
  border:1px solid var(--border-2);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--text);
  box-shadow:var(--shadow-sm);
}
.edit-controls button:disabled{opacity:.28;pointer-events:none}
.app-slot.editing .app-icon{animation:jiggle 2.4s ease-in-out infinite}
.app-slot.editing:nth-child(even) .app-icon{animation-delay:.18s}
@keyframes jiggle{
  0%,100%{transform:rotate(-1.4deg)}
  50%{transform:rotate(1.4deg)}
}
.app-slot[draggable="true"]{cursor:grab}
.app-slot.dragging{opacity:.35}
.app-slot.drag-over .app-icon{outline:2px solid var(--cyan);outline-offset:3px}
.edit-banner{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:11px 14px;margin-bottom:14px;
  border-radius:var(--r-md);
  background:rgba(59,125,255,.12);
  border:1px solid rgba(59,125,255,.3);
  font-size:12.5px;color:var(--text);
}
.edit-banner p{margin:0;flex:1 1 180px;color:var(--muted)}

/* ============================================================
   5. LISTS / DETAILS / FORMS
   ============================================================ */
.stack{display:grid;gap:12px}

.screen-head{
  display:flex;align-items:center;gap:12px;
  padding:6px 0 16px;
  position:sticky;top:0;z-index:15;
  background:linear-gradient(180deg,var(--bg) 55%, transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
[data-theme="light"] .screen-head{background:linear-gradient(180deg,#e9edf5 55%, transparent)}
.screen-head h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0;flex:1 1 auto;min-width:0}
.screen-head .sub{font-size:12px;color:var(--muted);margin:2px 0 0}

.field{
  display:flex;align-items:center;gap:9px;
  padding:10px 13px;
  border-radius:var(--r-sm);
  background:var(--surface);
  border:1px solid var(--border);
  min-height:44px;
}
.field input,.field textarea,.field select{
  flex:1;min-width:0;background:none;border:0;outline:none;
  color:var(--text);font-size:14px;
}
.field select{cursor:pointer;}
.field textarea{resize:vertical;min-height:104px;line-height:1.6;padding-top:2px}
.field:focus-within{border-color:var(--border-2);background:var(--surface-2)}
.field.invalid{border-color:#ff6b6b}
.field-label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.err{color:#ff8585;font-size:12px;margin:6px 0 0;display:flex;gap:5px;align-items:center}

.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.result-count{font-size:12px;color:var(--muted);margin:0 0 12px}

.plist{display:grid;gap:10px}
.pitem{
  display:flex;align-items:center;gap:13px;width:100%;
  padding:13px;text-align:start;
  border-radius:var(--r-md);
  background:var(--surface);
  border:1px solid var(--border);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  transition:transform .2s cubic-bezier(.2,.9,.25,1), background .2s, border-color .2s;
}
.pitem:hover{transform:translateY(-2px);background:var(--surface-2);border-color:var(--border-2)}
.pitem-icon{
  width:46px;height:46px;flex:0 0 auto;border-radius:14px;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(155deg,var(--a1),var(--a2));
  box-shadow:0 6px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.34);
}
.pitem-body{flex:1;min-width:0}
.pitem-name{font-size:14px;font-weight:640;margin:0 0 2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pitem-meta{font-size:11.5px;color:var(--muted);margin:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pitem-chev{color:var(--faint);flex:0 0 auto}

.kv{display:grid;gap:9px}
.kv-row{display:flex;gap:12px;align-items:baseline;font-size:13px;justify-content:space-between}
.kv-key{color:var(--muted);flex:0 0 auto}
.kv-val{text-align:end;font-weight:600;word-break:break-word;min-width:0}

.tag{
  display:inline-flex;align-items:center;
  padding:4px 10px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--border);
  font-size:11.5px;font-weight:600;color:var(--muted);
}

.empty{
  padding:26px 18px;text-align:center;
  border-radius:var(--r-md);
  border:1px dashed var(--border-2);
  background:rgba(255,255,255,.02);
}
.empty-icon{
  width:44px;height:44px;border-radius:14px;margin:0 auto 12px;
  display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--muted);
}
.empty h3{margin:0 0 6px;font-size:14.5px;font-weight:650}
.empty p{margin:0 auto;font-size:12.5px;color:var(--muted);max-width:44ch;line-height:1.6}
.empty code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11.5px;padding:1.5px 5px;border-radius:6px;
  background:var(--surface-2);border:1px solid var(--border);
}

.notice{
  display:flex;gap:10px;align-items:flex-start;
  padding:12px 14px;border-radius:var(--r-sm);
  font-size:12.5px;line-height:1.6;
  background:rgba(59,125,255,.10);
  border:1px solid rgba(59,125,255,.28);
  color:var(--text);
}
.notice.warn{background:rgba(255,183,77,.10);border-color:rgba(255,183,77,.3)}
.notice.ok{background:rgba(55,224,160,.10);border-color:rgba(55,224,160,.3)}
.notice svg{flex:0 0 auto;margin-top:1px}
.notice p{margin:0}

.draft-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;
  border:1px dashed var(--border-2);color:var(--muted);
}

/* services grid */
.svc-grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:620px){.svc-grid{grid-template-columns:1fr 1fr}}
.svc-icon{
  width:42px;height:42px;border-radius:13px;margin-bottom:12px;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(155deg,var(--blue),var(--violet));
  box-shadow:0 6px 18px rgba(59,125,255,.3), inset 0 1px 0 rgba(255,255,255,.3);
}

/* ============================================================
   6. DOCK
   ============================================================ */
.dock-wrap{
  position:relative;z-index:30;
  padding:6px var(--pad-x) calc(env(safe-area-inset-bottom,0px) + 10px);
}
.dock{
  max-width:540px;margin-inline:auto;
  display:flex;gap:3px;
  padding:7px;
  border-radius:var(--r-lg);
  background:var(--surface-2);
  border:1px solid var(--border-2);
  backdrop-filter:blur(30px) saturate(190%);
  -webkit-backdrop-filter:blur(30px) saturate(190%);
  box-shadow:var(--shadow-lg);
}
.dock-btn{
  flex:1 1 0;min-width:0;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 2px 6px;
  border-radius:18px;
  color:var(--muted);
  font-size:9.5px;font-weight:600;letter-spacing:.02em;
  transition:background .22s, color .22s, transform .22s;
}
.dock-btn span{
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.dock-btn:hover{color:var(--text);background:rgba(255,255,255,.05)}
.dock-btn[aria-current="page"]{color:var(--text);background:var(--surface-3)}
.dock-btn[aria-current="page"] svg{filter:drop-shadow(0 0 8px rgba(42,212,238,.6))}

/* ============================================================
   7. TOAST
   ============================================================ */
.toast{
  position:fixed;z-index:100;
  left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);
  transform:translate(-50%, 14px);
  max-width:min(92vw, 460px);
  padding:11px 18px;
  border-radius:999px;
  background:var(--surface-3);
  border:1px solid var(--border-2);
  backdrop-filter:blur(26px) saturate(180%);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  box-shadow:var(--shadow-lg);
  font-size:13px;font-weight:550;text-align:center;
  opacity:0;pointer-events:none;
  transition:opacity .3s, transform .3s cubic-bezier(.2,.9,.25,1);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   8. MOTION PREFERENCES
   ============================================================ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}
html[data-motion="reduce"] *,html[data-motion="reduce"] *::before,html[data-motion="reduce"] *::after{
  animation-duration:.001ms !important;
  animation-iteration-count:1 !important;
  transition-duration:.001ms !important;
  scroll-behavior:auto !important;
}

/* ============================================================
   9. RESPONSIVE TWEAKS
   ============================================================ */
@media (max-width:400px){
  :root{--pad-x:14px;--r-lg:22px}
  .sb-date{display:none}
  .hero{padding:16px}
  .card{padding:14px}
}
@media (max-width:340px){
  .sb-sim span{display:none}
}
@media (min-width:900px){
  .page,.screen{padding-bottom:40px}
  .page{padding-bottom:78px}
}

const NS = "http://www.w3.org/2000/svg";

function svgIcon(name, size, extraClass) {
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("width", size);
  s.setAttribute("height", size);
  s.setAttribute("fill", "none");
  s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "1.7");
  s.setAttribute("stroke-linecap", "round");
  s.setAttribute("stroke-linejoin", "round");
  s.setAttribute("aria-hidden", "true");
  s.setAttribute("focusable", "false");
  if (extraClass) s.setAttribute("class", extraClass);
  s.innerHTML = ICONS[name] || "";
  return s;
}

function svgGlyph(name, size) {
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("width", size);
  s.setAttribute("height", size);
  s.setAttribute("fill", "none");
  s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "1.55");
  s.setAttribute("stroke-linecap", "round");
  s.setAttribute("stroke-linejoin", "round");
  s.setAttribute("aria-hidden", "true");
  s.setAttribute("focusable", "false");
  s.innerHTML = GLYPHS[name] || GLYPHS.globe;
  return s;
}

/* ================================================================
   SECTION 4 — HELPERS
   ================================================================ */
function h(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k === "html") n.innerHTML = v;
      else if (k === "style" && typeof v === "object") Object.assign(n.style, v);
      else if (k.startsWith("on") && typeof v === "function")
        n.addEventListener(k.slice(2).toLowerCase(), v);
      else n.setAttribute(k, v === true ? "" : String(v));
    }
  }
  for (const kid of kids.flat(3)) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
}

function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

let _toastTimer = null;
function toast(msg) {
  let el = document.getElementById("toast");
  if (!el) {
    el = h("div", { id: "toast", class: "toast", role: "status", "aria-live": "polite" });
    document.body.append(el);
  }
  el.textContent = msg;
  requestAnimationFrame(() => el.classList.add("show"));
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove("show"), 3400);
}

function safeUrl(value) {
  if (typeof value !== "string") return null;
  const raw = value.trim();
  if (!raw) return null;
  try {
    const u = new URL(raw, window.location.href);
    if (u.protocol === "http:" || u.protocol === "https:") return u.href;
  } catch (e) { /* ignore */ }
  return null;
}

function safeImage(value) {
  if (typeof value !== "string") return null;
  const raw = value.trim();
  if (!raw) return null;
  if (raw.startsWith("data:image/")) return raw;
  try {
    const u = new URL(raw, window.location.href);
    if (u.protocol === "http:" || u.protocol === "https:") return u.href;
  } catch (e) { /* ignore */ }
  return null;
}

function safeMailto(value) {
  if (typeof value !== "string") return null;
  const raw = value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(raw)) return null;
  return raw;
}

const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

function digits(str) {
  if (state.lang !== "fa") return String(str);
  const fa = ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
  return String(str).replace(/[0-9]/g, d => fa[+d]);
}

const STORAGE_KEY = "nononick.os.v2";

function configOrder() { return PROJECTS.map(p => p.id); }

function reconcileOrder(saved) {
  const valid = configOrder();
  const out = [];
  if (Array.isArray(saved)) {
    for (const id of saved) {
      if (valid.includes(id) && !out.includes(id)) out.push(id);
    }
  }
  for (const id of valid) if (!out.includes(id)) out.push(id);
  return out;
}

  theme: "dark",
  motion: "system",
  order: [],

  contactEmail: SITE.defaultEmail || "",

  route: "home",
  routeParam: null,
  search: "",
  filterCategory: "all",
  filterStatus: "all",
  pageIndex: 0,
  previousHash: null
};

function sanitizeProject(p) {
  if (!p || typeof p !== "object") return null;
  const id = typeof p.id === "string" && p.id ? p.id : "p-" + Date.now() + "-" + Math.random().toString(36).slice(2,6);
  
  let name = { en: "", fa: "" };
  if (p.name) {
    if (typeof p.name === "string") name.en = p.name;
    else {
      name.en = typeof p.name.en === "string" ? p.name.en : "";
      name.fa = typeof p.name.fa === "string" ? p.name.fa : "";
    }
  }
  if (!name.en && !name.fa) return null;

  const category = (typeof p.category === "string" && CATEGORIES[p.category]) ? p.category : "web";
  const glyph = (typeof p.glyph === "string" && GLYPHS[p.glyph]) ? p.glyph : "globe";
  const accent = Array.isArray(p.accent) && p.accent.length === 2 ? p.accent : ["#3b7dff", "#22d3ee"];
  const status = (p.status && STATUS_LABEL[p.status]) ? p.status : "unset";
  const url = p.url ? safeUrl(p.url) : null;
  const repo = p.repo ? safeUrl(p.repo) : null;
  const technologies = Array.isArray(p.technologies) ? p.technologies.filter(x => typeof x === "string") : [];
  const screenshots = Array.isArray(p.screenshots) ? p.screenshots.map(safeImage).filter(Boolean) : [];
  
  let desc = { en: "", fa: "" };
  if (p.description) {
    if (typeof p.description === "string") desc.en = p.description;
    else {
      desc.en = typeof p.description.en === "string" ? p.description.en : "";
      desc.fa = typeof p.description.fa === "string" ? p.description.fa : "";
    }
  }

  return { id, name, category, glyph, accent, status, featured: p.featured === true, url, repo, technologies, screenshots, description: desc };
}

function loadState() {
  let data = null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("nononick.os.v1");
    if (raw) data = JSON.parse(raw);
  } catch (e) {}

  PROJECTS = [];
  if (data && Array.isArray(data.projects) && data.projects.length > 0) {
    for (const rp of data.projects) {
      const p = sanitizeProject(rp);
      if (p) PROJECTS.push(p);
    }
  }
  if (PROJECTS.length === 0) {
    PROJECTS = JSON.parse(JSON.stringify(DEFAULT_PROJECTS));
  }

  rebuildProjectIndex();

  if (data && typeof data === "object") {
    if (data.lang === "en" || data.lang === "fa") state.lang = data.lang;
    if (data.theme === "dark" || data.theme === "light") state.theme = data.theme;
    if (data.motion === "system" || data.motion === "reduce") state.motion = data.motion;
    if (typeof data.contactEmail === "string") state.contactEmail = data.contactEmail;
    
    if (typeof data.featuredId === "string" && PROJECT_BY_ID[data.featuredId]) {
      state.featuredId = data.featuredId;
    }
    state.order = reconcileOrder(data.order);
  } else {
    state.order = configOrder();
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      lang: state.lang,
      theme: state.theme,
      motion: state.motion,
      contactEmail: state.contactEmail,
      featuredId: state.featuredId,
      order: state.order,
      projects: PROJECTS
    }));
  } catch (e) { toast("Storage full or unavailable."); }
}

function orderedProjects() {
  return state.order.map(id => PROJECT_BY_ID[id]).filter(Boolean);
}

function t(key, vars) {

  if (vars) for (const k in vars) s = s.replace("{" + k + "}", vars[k]);
  return s;
}
function L(obj) {

  return obj[state.lang] || obj.en || "";
}

function greetingKey() {
  const hr = new Date().getHours();
  if (hr >= 5 && hr < 12) return "greetingMorning";
  if (hr >= 12 && hr < 17) return "greetingAfternoon";
  if (hr >= 17 && hr < 22) return "greetingEvening";
  return "greetingNight";
}

function tickClock() {
  const now = new Date();
  const locale = state.lang === "fa" ? "fa-IR" : "en-US";
  try {
    timeEl.textContent = new Intl.DateTimeFormat(locale, { hour: "2-digit", minute: "2-digit", hour12: state.lang !== "fa" }).format(now);
    dateEl.textContent = new Intl.DateTimeFormat(locale, { weekday: "short", month: "short", day: "numeric" }).format(now);
  } catch (e) {
    timeEl.textContent = now.getHours() + ":" + now.getMinutes();
    dateEl.textContent = now.toDateString();
  }
}

function buildDock() {
  clear(dockEl);
  const items = [
    { key: "home",     icon: "home",      hash: "#/home" },
    { key: "projects", icon: "grid",      hash: "#/projects" },
    { key: "services", icon: "briefcase", hash: "#/services" },
    { key: "about",    icon: "user",      hash: "#/about" },
    { key: "contact",  icon: "mail",      hash: "#/contact" }
  ];
  items.forEach(item => {
    const active = state.route === item.key || (item.key === "projects" && (state.route === "project" || state.route === "edit"));
    dockEl.append(h("button", {
      class: "dock-btn", type: "button", "data-nav": item.key,
      "aria-current": active ? "page" : false,

      onclick: () => navigate(item.hash)
    }, svgIcon(item.icon, 20), h("span", { text: t(item.key) })));

}

function refreshDock() {
  dockEl.querySelectorAll("[data-nav]").forEach(btn => {
    const key = btn.getAttribute("data-nav");
    const active = state.route === key || (key === "projects" && (state.route === "project" || state.route === "edit"));
    if (active) btn.setAttribute("aria-current", "page");
    else btn.removeAttribute("aria-current");
    btn.querySelector("span").textContent = t(key);
  });
}

function buildIslandPanel() {

function openIsland() { buildIslandPanel(); islandPanel.hidden = false; islandBtn.setAttribute("aria-expanded", "true"); }
function closeIsland() { islandPanel.hidden = true; islandBtn.setAttribute("aria-expanded", "false"); }
islandBtn.addEventListener("click", ev => { ev.stopPropagation(); if (islandPanel.hidden) openIsland(); else closeIsland(); });
document.addEventListener("click", ev => { if (!islandPanel.hidden && !islandPanel.contains(ev.target) && !islandBtn.contains(ev.target)) closeIsland(); });

function applyTheme() {
  document.documentElement.setAttribute("data-theme", state.theme);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", state.theme === "dark" ? "#000000" : "#e9edf5");
}
function applyLang() {
  document.documentElement.setAttribute("lang", state.lang);
  document.documentElement.setAttribute("dir", state.lang === "fa" ? "rtl" : "ltr");
}
function applyMotion() {
  if (state.motion === "reduce") document.documentElement.setAttribute("data-motion", "reduce");
  else document.documentElement.removeAttribute("data-motion");
}
function setTheme(v) { state.theme = v; applyTheme(); saveState(); renderScreen(); refreshDock(); }
function setLang(v) { state.lang = v; applyLang(); saveState(); buildDock(); renderScreen(); tickClock(); }
function setMotion(v) { state.motion = v; applyMotion(); saveState(); renderScreen(); }

/* ================================================================
   SECTION 9 — ROUTER
   ================================================================ */
const ROUTES = ["home", "projects", "project", "edit", "services", "about", "contact", "settings"];

function parseHash() {
  const raw = (location.hash || "").replace(/^#\/?/, "");
  if (!raw) return { route: "home", param: null };
  const parts = raw.split("/").filter(Boolean);
  const name = parts[0];
  if (!ROUTES.includes(name)) return { route: "home", param: null };
  
  if (name === "project" || name === "edit") {
    const id = parts[1] ? decodeURIComponent(parts[1]) : null;
    if (!id && name === "edit") return { route: "edit", param: "new" };
    if (!id || !PROJECT_BY_ID[id]) return { route: "projects", param: null };
    return { route: name, param: id };
  }
  return { route: name, param: null };
}

function navigate(hash) {
  if (location.hash === hash) { renderScreen(); return; }
  location.hash = hash;
}

function onRouteChange() {
  const next = parseHash();
  state.previousHash = location.hash;
  state.route = next.route;
  state.routeParam = next.param;
  if (next.route !== "home") state.editMode = false;
  closeIsland();
  renderScreen();
  refreshDock();
  buildDock();
}

window.addEventListener("hashchange", onRouteChange);

/* ================================================================
   SECTION 10 — SCREEN RENDERING
   ================================================================ */
let pagesElRef = null;

function renderScreen() {
  pagesElRef = null;
  clear(stageEl);
  let node = null;

  switch (state.route) {
    case "home":     node = screenHome(); break;
    case "projects": node = screenProjects(); break;
    case "project":  node = screenProjectDetail(state.routeParam); break;
    case "edit":     node = screenEditProject(state.routeParam); break;
    case "services": node = screenServices(); break;
    case "about":    node = screenAbout(); break;
    case "contact":  node = screenContact(); break;
    case "settings": node = screenSettings(); break;
    default:         node = screenHome();
  }
  stageEl.append(node);

  if (pagesElRef) {
    requestAnimationFrame(() => {
      pagesElRef.scrollLeft = state.pageIndex * pagesElRef.clientWidth;
      updateDots();
      updateArrows();
    });
  }

  const heading = stageEl.querySelector("[data-screen-title]");
  if (heading) {
    heading.setAttribute("tabindex", "-1");
    if (state.previousHash !== null) heading.focus({ preventScroll: true });
  }
}

/* ---------------------------------------------------------------
   HOME
   --------------------------------------------------------------- */
function screenHome() {
  const projects = orderedProjects();
  const perPage = 4;
  const chunks = [];
  for (let i = 0; i < projects.length; i += perPage) chunks.push(projects.slice(i, i + perPage));
  if (chunks.length === 0) chunks.push([]);

  const pages = [];

  pages.push(pageWrap([
    heroWidget(),
    ...chunks[0].map((p, i) => appSlot(p, i)),
    aboutMiniWidget(),
    contactMiniWidget()
  ]));

  pages.push(pageWrap([
    featuredWidget(),
    ...(chunks[1] || []).map((p, i) => appSlot(p, i + perPage)),
    servicesWidget()
  ]));

  for (let c = 2; c < chunks.length; c++) {
    pages.push(pageWrap(chunks[c].map((p, i) => appSlot(p, i + c * perPage))));
  }

  pages.push(pageWrap([
    activityWidget(),
    experimentsWidget(),
    settingsWidget()
  ]));

  if (state.pageIndex > pages.length - 1) state.pageIndex = pages.length - 1;
  if (state.pageIndex < 0) state.pageIndex = 0;

  const pagesEl = h("div", { class: "pages", id: "pages", role: "group" }, pages);
  pagesElRef = pagesEl;

  pagesEl.addEventListener("scroll", () => {
    if (pagesEl._raf) return;
    pagesEl._raf = requestAnimationFrame(() => {
      pagesEl._raf = null;
      const w = pagesEl.clientWidth || 1;
      const idx = Math.round(pagesEl.scrollLeft / w);
      if (idx !== state.pageIndex) {
        state.pageIndex = Math.max(0, Math.min(pages.length - 1, idx));
        updateDots();
        updateArrows();
      }
    });
  }, { passive: true });

  const dots = h("div", { class: "dots", id: "dots", role: "tablist" });
  pages.forEach((_, i) => {
    dots.append(h("button", {
      class: "dot", type: "button", role: "tab",
      "data-dot": i,
      "aria-label": "Page " + (i + 1),
      "aria-current": i === state.pageIndex ? "true" : "false",
      onclick: () => goToPage(i)
    }));
  });

  const arrows = h("div", { class: "page-arrows" },
    h("button", { class: "parrow prev", type: "button", id: "prevPage", onclick: () => goToPage(state.pageIndex - 1) }, svgIcon("chevronL", 18)),
    h("button", { class: "parrow next", type: "button", id: "nextPage", onclick: () => goToPage(state.pageIndex + 1) }, svgIcon("chevronR", 18))
  );

  const frag = document.createDocumentFragment();
  if (state.editMode) frag.append(editBanner());
  frag.append(pagesEl, arrows, dots);
  return h("div", { style: { position: "relative", height: "100%" } }, frag);
}

function pageWrap(children) {
  return h("div", { class: "page", dir: state.lang === "fa" ? "rtl" : "ltr" },
    h("div", { class: "page-inner" }, h("div", { class: "grid" }, children))
  );
}

function goToPage(i) {
  const el = pagesElRef;
  if (!el) return;
  const max = Math.round(el.scrollWidth / el.clientWidth) - 1;
  const target = Math.max(0, Math.min(max, i));
  state.pageIndex = target;
  el.scrollTo({ left: target * el.clientWidth, behavior: state.motion === "reduce" ? "auto" : "smooth" });
  updateDots();
  updateArrows();
}

function updateDots() {
  const dots = document.getElementById("dots");
  if (!dots) return;
  dots.querySelectorAll("[data-dot]").forEach(d => {
    d.setAttribute("aria-current", Number(d.getAttribute("data-dot")) === state.pageIndex ? "true" : "false");
  });
}

function updateArrows() {
  const el = pagesElRef;
  if (!el) return;
  const total = Math.round(el.scrollWidth / el.clientWidth);
  const prev = document.getElementById("prevPage");
  const next = document.getElementById("nextPage");
  if (prev) prev.disabled = state.pageIndex <= 0;
  if (next) next.disabled = state.pageIndex >= total - 1;
}

/* ---------- App icon slot ---------- */
let dragProjectId = null;

function appSlot(p, index) {
  const name = L(p.name);
  const slot = h("div", { class: "app-slot" + (state.editMode ? " editing" : "") });

  const iconBox = h("span", { class: "app-icon", style: { "--a1": p.accent[0], "--a2": p.accent[1] } }, svgGlyph(p.glyph, 30));
  const btn = h("button", {
    class: "app", type: "button", "data-app": p.id,
    "aria-label": name,
    onclick: () => {
      if (state.editMode) navigate("#/edit/" + encodeURIComponent(p.id));
      else navigate("#/project/" + encodeURIComponent(p.id));
    }
  }, iconBox, h("span", { class: "app-label", text: name }));

  slot.append(btn);

  if (p.status && p.status !== "unset") {
    slot.append(h("span", { class: "app-status st-" + p.status, style: { marginTop: "-2px" } }, h("span", { class: "dotmark" }), statusLabel(p.status)));
  }

  if (state.editMode) {
    slot.setAttribute("draggable", "true");
    slot.addEventListener("dragstart", ev => {
      dragProjectId = p.id;
      try { ev.dataTransfer.effectAllowed = "move"; ev.dataTransfer.setData("text/plain", p.id); } catch (e) {}
      slot.classList.add("dragging");
    });
    slot.addEventListener("dragover", ev => {
      if (!dragProjectId || dragProjectId === p.id) return;
      ev.preventDefault(); slot.classList.add("drag-over");
    });
    slot.addEventListener("dragleave", () => slot.classList.remove("drag-over"));
    slot.addEventListener("drop", ev => {
      ev.preventDefault(); slot.classList.remove("drag-over");
      let from = dragProjectId;
      try { from = from || ev.dataTransfer.getData("text/plain"); } catch (e) {}
      if (from && from !== p.id) {
        const f = state.order.indexOf(from);
        const t = state.order.indexOf(p.id);
        if (f > -1 && t > -1) {
          state.order.splice(f, 1);
          state.order.splice(t, 0, from);
          saveState(); renderScreen();
        }
      }
    });
    slot.addEventListener("dragend", () => {
      dragProjectId = null; slot.classList.remove("dragging");
      stageEl.querySelectorAll(".drag-over").forEach(n => n.classList.remove("drag-over"));
    });

    const idx = state.order.indexOf(p.id);
    slot.append(h("div", { class: "edit-controls" },
      h("button", { type: "button", disabled: idx <= 0, onclick: (ev) => { ev.stopPropagation(); moveProject(p.id, -1); } }, svgIcon(state.lang === "fa" ? "chevronR" : "chevronL", 14)),
      h("button", { type: "button", disabled: idx >= state.order.length - 1, onclick: (ev) => { ev.stopPropagation(); moveProject(p.id, 1); } }, svgIcon(state.lang === "fa" ? "chevronL" : "chevronR", 14))
    ));
  }

  return slot;
}

function moveProject(id, dir) {
  const i = state.order.indexOf(id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= state.order.length) return;
  const tmp = state.order[i];
  state.order[i] = state.order[j];
  state.order[j] = tmp;
  saveState(); renderScreen();
}

/* ---------------------------------------------------------------
   EDIT PROJECT (THE FORM)
   --------------------------------------------------------------- */
function screenEditProject(id) {
  const isNew = id === "new";
  const p = isNew ? {
    id: "p-" + Date.now(),
    name: { en: "", fa: "" },
    category: "web",
    glyph: "globe",
    accent: ["#3b7dff", "#22d3ee"],
    status: "unset",
    featured: false,
    url: "", repo: "", technologies: [], screenshots: [], description: { en: "", fa: "" }
  } : PROJECT_BY_ID[id];

  if (!p) return h("div", { class: "screen" }, h("h1", null, "Not Found"));

  const form = h("form", { class: "stack", novalidate: true });
  const errEl = h("p", { class: "err", hidden: true });
  errEl.hidden = true;

  const field = (label, inputNode) => h("div", null, h("label", { class: "field-label", text: label }), inputNode);
  const input = (val, id, type = "text") => h("div", { class: "field" }, h("input", { type, id, value: val || "" }));

  form.append(
    h("div", { style: { display: "grid", gap: "12px" } },
      field(t("projNameEn"), input(p.name.en, "f-name-en")),
      field(t("projNameFa"), input(p.name.fa, "f-name-fa")),
      field(t("projCategory"), h("div", { class: "field" }, h("select", { id: "f-cat" }, Object.keys(CATEGORIES).map(k => h("option", { value: k, selected: p.category === k, text: catLabel(k) }))))),
      field(t("projStatus"), h("div", { class: "field" }, h("select", { id: "f-status" }, Object.keys(STATUS_LABEL).map(k => h("option", { value: k, selected: p.status === k, text: statusLabel(k) }))))),
      field(t("projUrl"), input(p.url, "f-url", "url")),
      field(t("projRepo"), input(p.repo, "f-repo", "url")),
      field(t("projTech"), input(p.technologies.join(", "), "f-tech")),
      field(t("projDescEn"), h("div", { class: "field" }, h("textarea", { id: "f-desc-en" }, p.description.en))),
      field(t("projDescFa"), h("div", { class: "field" }, h("textarea", { id: "f-desc-fa" }, p.description.fa))),
      
      // Screenshots section
      h("div", null,
        h("label", { class: "field-label", text: t("projScreens") }),
        h("div", { id: "f-screens-wrap", class: "stack" },
          p.screenshots.map(src => h("div", { class: "field" }, h("input", { type: "url", value: src, class: "f-screen-input" })))
        ),
        h("div", { style: { display: "flex", gap: "8px", marginTop: "8px", flexWrap: "wrap" } },
          h("button", { class: "btn btn-sm", type: "button", onclick: () => {
            const wrap = document.getElementById("f-screens-wrap");
            wrap.append(h("div", { class: "field" }, h("input", { type: "url", placeholder: "https://...", class: "f-screen-input" })));
          }}, svgIcon("plus", 14), t("addScreenshot")),
          h("button", { class: "btn btn-sm", type: "button", onclick: () => {
            const fileIn = document.createElement("input");
            fileIn.type = "file"; fileIn.accept = "image/*";
            fileIn.onchange = e => {
              const f = e.target.files[0];
              if (!f) return;
              if (f.size > 500000) { alert("Image is larger than 500KB. Please use a URL instead."); return; }
              const reader = new FileReader();
              reader.onload = ev => {
                const wrap = document.getElementById("f-screens-wrap");
                wrap.append(h("div", { class: "field" }, h("input", { type: "url", value: ev.target.result, class: "f-screen-input" })));
              };
              reader.readAsDataURL(f);
            };
            fileIn.click();
          }}, svgIcon("layers", 14), t("uploadImage"))
        )
      )
    ),
    errEl,
    h("div", { style: { display: "flex", gap: "8px", marginTop: "20px", flexWrap: "wrap" } },
      h("button", { class: "btn btn-primary", type: "submit" }, svgIcon("check", 14), t("saveProject")),
      h("button", { class: "btn", type: "button", onclick: () => navigate("#/home") }, t("close")),
      !isNew ? h("button", { class: "btn", type: "button", style: { color: "#ff8585", borderColor: "#ff858555" }, onclick: () => {
        if (confirm(t("confirmDelete"))) {
          const idx = PROJECTS.findIndex(x => x.id === p.id);
          if (idx > -1) {
            PROJECTS.splice(idx, 1);
            state.order = state.order.filter(x => x !== p.id);
            saveState();
            navigate("#/home");
          }
        }
      }}, svgIcon("trash", 14), t("deleteProject")) : null
    )
  );

  form.onsubmit = ev => {
    ev.preventDefault();
    const nEn = document.getElementById("f-name-en").value.trim();
    const nFa = document.getElementById("f-name-fa").value.trim();
    if (!nEn && !nFa) {
      errEl.textContent = t("invalidProjectName");
      errEl.hidden = false;
      return;
    }

    const screens = [];
    form.querySelectorAll(".f-screen-input").forEach(inp => {
      if (inp.value.trim()) screens.push(inp.value.trim());
    });

    p.name = { en: nEn, fa: nFa };
    p.category = document.getElementById("f-cat").value;
    p.status = document.getElementById("f-status").value;
    p.url = document.getElementById("f-url").value.trim() || null;
    p.repo = document.getElementById("f-repo").value.trim() || null;
    p.technologies = document.getElementById("f-tech").value.split(",").map(s => s.trim()).filter(Boolean);
    p.description = {
      en: document.getElementById("f-desc-en").value.trim(),
      fa: document.getElementById("f-desc-fa").value.trim()
    };
    p.screenshots = screens;

    if (isNew) {
      PROJECTS.push(p);
      state.order.push(p.id);
    }
    
    rebuildProjectIndex();
    saveState();
    navigate("#/project/" + p.id);
  };

  return h("div", { class: "screen" },
    h("div", { class: "screen-inner" },
      h("div", { class: "screen-head" }, h("h1", { "data-screen-title": true, text: isNew ? t("newProject") : t("editProject") })),
      form
    )
  );
}

/* ---------------------------------------------------------------
   SETTINGS + IMPORT
   --------------------------------------------------------------- */
function screenSettings() {
  const fileInput = h("input", { type: "file", accept: ".json, .csv, .txt, .html, .pdf, */*", hidden: true });
  
  fileInput.onchange = ev => {
    const file = ev.target.files[0];
    ev.target.value = "";
    if (!file) return;

    const reader = new FileReader();
    reader.onload = e => {
      const text = e.target.result;
      let importedCount = 0;

      // Try JSON
      try {
        const data = JSON.parse(text);
        const arr = Array.isArray(data) ? data : (data.projects || null);
        if (arr && Array.isArray(arr)) {
          PROJECTS = [];
          arr.forEach(rp => { const p = sanitizeProject(rp); if (p) { PROJECTS.push(p); importedCount++; } });
        }
      } catch (err) {
        // Try CSV
        if (file.name.endsWith(".csv")) {
          const lines = text.split("\n");
          PROJECTS = [];
          lines.forEach((line, i) => {
            if (i === 0 || !line.trim()) return; // skip header
            const parts = line.split(",");
            if (parts.length >= 2) {
              const p = sanitizeProject({ name: { en: parts[0], fa: parts[1] }, description: { en: parts[2] || "", fa: parts[3] || "" }, url: parts[4] || null });
              if (p) { PROJECTS.push(p); importedCount++; }
            }
          });
        } 
        // Try raw text / HTML
        else {
          PROJECTS = [];
          const p = sanitizeProject({ name: { en: file.name }, description: { en: text.slice(0, 2000) } });
          if (p) { PROJECTS.push(p); importedCount++; }
        }
      }

      if (importedCount > 0) {
        rebuildProjectIndex();
        state.order = configOrder();
        state.featuredId = null;
        saveState();
        toast(t("importSuccess"));
        navigate("#/home");
      } else {
        toast(t("importFailed"));
      }
    };
    reader.readAsText(file);
  };

  return h("div", { class: "screen" }, h("div", { class: "screen-inner" },
    h("h1", { "data-screen-title": true, text: t("settings") }),
    h("div", { class: "card" },
      h("h2", { class: "card-title", text: t("dataTools") }),
      h("p", { class: "card-text", text: t("dataIntro") }),
      h("div", { style: { display: "flex", gap: "8px", marginTop: "12px", flexWrap: "wrap" } },
        h("button", { class: "btn btn-sm btn-primary", onclick: () => fileInput.click() }, svgIcon("arrowUp", 14), t("importBtn")),
        fileInput
      )
    )
  ));
}
